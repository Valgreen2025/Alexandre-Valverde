<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="210" stroke="white" stroke-opacity="0.08" stroke-width="4" />
  
  <!-- Headphones motif arc -->
  <path d="M 140 260 A 116 116 0 0 1 372 260" stroke="#60a5fa" stroke-width="20" stroke-linecap="round" fill="none" />
  
  <!-- Ear cups -->
  <rect x="120" y="240" width="36" height="64" rx="18" fill="#38bdf8" />
  <rect x="356" y="240" width="36" height="64" rx="18" fill="#38bdf8" />

  <!-- Large Stylized 'A' in the center -->
  <path d="M 256 140 L 320 330 H 285 L 268 280 H 244 L 227 330 H 192 L 256 140 Z M 256 220 L 249 250 H 263 L 256 220 Z" fill="white" />

  <!-- American Flag Accent Badge -->
  <g transform="translate(290, 310)">
    <circle cx="24" cy="24" r="24" fill="#0369a1" />
    <!-- Mini stripes -->
    <path d="M 0 18 H 48 V 26 H 0 Z" fill="#ef4444" />
    <path d="M 0 34 H 48 V 42 H 0 Z" fill="#ef4444" />
    <!-- White divider -->
    <path d="M 0 26 H 48 V 34 H 0 Z" fill="white" />
    <!-- Mini star -->
    <circle cx="14" cy="14" r="6" fill="#fbbf24" />
  </g>

  <!-- Voice Waves -->
  <path d="M 216 380 Q 236 365 256 380 T 296 380" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
  <path d="M 196 395 Q 226 380 256 395 T 316 395" stroke="#fcd34d" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8" />
</svg>